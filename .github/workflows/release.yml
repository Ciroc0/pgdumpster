name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:coverage
      - name: Validate release identity
        shell: bash
        run: |
          test "$(node -p "require('./package.json').private")" = "false"
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          test "$(node -p "require('./package.json').version")" != "0.0.0-development"
      - name: Pack package
        run: npm pack --json > package.jsonl
      - name: Generate checksums and SBOM
        shell: bash
        run: |
          PACKAGE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.jsonl','utf8'))[0].filename)")
          sha256sum "$PACKAGE" > SHA256SUMS.txt
          npm sbom --sbom-format cyclonedx > pgdumpster.cdx.json
      - name: Clean install smoke
        shell: bash
        run: |
          PACKAGE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.jsonl','utf8'))[0].filename)")
          mkdir smoke && cd smoke
          npm init -y
          npm install "../$PACKAGE"
          ./node_modules/.bin/pgdumpster --version
          ./node_modules/.bin/pgdumpster restore --help
      - name: Publish with npm trusted publishing
        run: npm publish --provenance --access public
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: "*.tgz"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes *.tgz SHA256SUMS.txt pgdumpster.cdx.json
