# Environment-dependent scheduled-backup template. It is not the local live
# recovery workflow and it is not evidence that GitHub-hosted runners can
# reach a given Supabase project. Enable it only after the runner's network,
# Docker daemon, Supabase access and destination access are validated against
# a disposable project. Perform a separate local recovery drill before relying
# on any resulting backup.
# Third-party actions are pinned by immutable commit SHA.

name: Supabase backup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  backup:
    if: ${{ vars.PGDUMPSTER_CI_BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install age and pgDumpster
        run: |
          sudo apt-get update
          sudo apt-get install --yes age
          npm install --global pgdumpster@0.1.2
          pgdumpster --version
      - name: Write non-secret backup configuration
        run: |
          cat > pgdumpster.yaml <<'YAML'
          backup:
            consistency: verified
          encryption:
            mode: age
            recipient: ${{ secrets.PGDUMPSTER_AGE_RECIPIENT }}
          destination:
            type: s3
            endpoint: ${{ vars.PGDUMPSTER_S3_ENDPOINT }}
            bucket: ${{ vars.PGDUMPSTER_S3_BUCKET }}
            prefix: pgdumpster
          YAML
      - name: Run backup
        env:
          PGDUMPSTER_ACCESS_TOKEN: ${{ secrets.PGDUMPSTER_ACCESS_TOKEN }}
          PGDUMPSTER_PROJECT_REF: ${{ secrets.PGDUMPSTER_PROJECT_REF }}
          PGDUMPSTER_DB_URL: ${{ secrets.PGDUMPSTER_DB_URL }}
          PGDUMPSTER_STORAGE_KEY: ${{ secrets.PGDUMPSTER_STORAGE_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
        run: |
          pgdumpster backup \
            --config pgdumpster.yaml \
            --project-ref "$PGDUMPSTER_PROJECT_REF" \
            --db-url-env PGDUMPSTER_DB_URL \
            --consistency verified \
            --non-interactive
